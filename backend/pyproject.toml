[project]
name = "premium-support-highlights"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "deepagents",
    "langchain-anthropic",
    "httpx",
    "python-dotenv",
    "pydantic",
    "beautifulsoup4",
    "langsmith>=0.2.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "markdown>=3.6",
    "langgraph-sdk>=0.1",
    "google-api-python-client>=2.0",
    "google-auth>=2.0",
    "matplotlib>=3.8",
    "google-cloud-bigquery>=3.0",
    "langchain-openai>=1.3.5",
    "langchain-fireworks>=1.4.4",
    "langchain-baseten>=0.2.1",
]

[dependency-groups]
dev = [
    "langgraph-cli[inmem]>=0.2",
]

[tool.setuptools.packages.find]
where = ["."]
include = []
